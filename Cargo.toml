[workspace]
resolver = "2"
members = [
    "crates/bili-api",
    "crates/bili-live",
    "crates/bili-audio",
    "crates/bdr",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[profile.release]
lto = true

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
